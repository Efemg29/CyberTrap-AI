[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybertrap-ai"
version = "0.1.0"
description = "Local LLM-powered honeypot for defensive cybersecurity research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Efe", organization = "Eastern Mediterranean University" }]
dependencies = [
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-ollama>=0.2.0",
  "colorama>=0.4.6",
  "rich>=13.7.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-timeout>=2.3.0"]

[project.scripts]
cybertrap = "cybertrap.main:main"

[tool.setuptools.packages.find]
include = ["cybertrap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
addopts = "-q"
